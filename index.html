  h1 { margin: 0; font-size: 2rem; }
  main { padding: 2rem; max-width: 1200px; margin: auto; }

  .aircraft-card p { margin: 0.3rem 0; }

  footer { text-align: center; padding: 1rem; background: #003366; color: white; margin-top: 2rem; }
</style>
